name: Validate CV System

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validators
        run: |
          python -m py_compile scripts/audit_repository.py scripts/validate_models.py
      - name: Run repository audit
        run: python scripts/audit_repository.py
